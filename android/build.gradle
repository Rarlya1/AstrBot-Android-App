allprojects {
    repositories {
        // google()
        // jcenter()
        maven { url 'https://storage.googleapis.com/repository/google' }
        maven { url 'https://storage.googleapis.com/repository/jcenter' }
        maven { url 'https://storage.googleapis.com/repository/public' }
    }
}

rootProject.buildDir = '../build'
def localRootPath = rootProject.projectDir.absolutePath
subprojects {
    if (project.projectDir.absolutePath.startsWith(localRootPath)) {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { subproject ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
        subproject.plugins.withId(pluginId) {
            subproject.extensions.getByName('android').defaultConfig.ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
