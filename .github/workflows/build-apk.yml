name: Build APK

on:
  push:
    branches: [fork]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'fork')
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Prepare NDK and CMake directories
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/ndk
          sudo mkdir -p /usr/local/lib/android/sdk/cmake
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk/ndk
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk/cmake

      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: ${{ runner.os }}-flutter-3.35.7-android-tools-${{ hashFiles('android/app/build.gradle', 'android/settings.gradle') }}
          restore-keys: |
            ${{ runner.os }}-flutter-3.35.7-android-tools-

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\)+.*/\1/p' pubspec.yaml)
          test -n "$VERSION" || { echo 'Unable to read app version'; exit 1; }
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          SECRETS_PK8_BASE64: ${{ secrets.SECRETS_PK8_BASE64 }}
          SECRETS_X509_PEM_BASE64: ${{ secrets.SECRETS_X509_PEM_BASE64 }}
        run: |
          test -n "$SECRETS_PK8_BASE64" || { echo 'Missing SECRETS_PK8_BASE64'; exit 1; }
          test -n "$SECRETS_X509_PEM_BASE64" || { echo 'Missing SECRETS_X509_PEM_BASE64'; exit 1; }
          printf '%s' "$SECRETS_PK8_BASE64" | base64 --decode > /tmp/secrets.pk8
          printf '%s' "$SECRETS_X509_PEM_BASE64" | base64 --decode > /tmp/secrets.x509.pem

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Sign APK with pk8 and x509 certificate
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" sign \
            --key /tmp/secrets.pk8 \
            --cert /tmp/secrets.x509.pem \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-release-signed.apk
          mv build/app/outputs/flutter-apk/app-release-signed.apk \
             build/app/outputs/flutter-apk/app-release.apk
          rm -f /tmp/secrets.pk8 /tmp/secrets.x509.pem

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/AstrBot-v${RELEASE_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstrBot-v${{ env.RELEASE_VERSION }}
          path: build/app/outputs/flutter-apk/AstrBot-v${{ env.RELEASE_VERSION }}.apk
          compression-level: 0
          if-no-files-found: error
